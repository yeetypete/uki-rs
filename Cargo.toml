[package]
name = "uki-rs"
version = "0.1.0"
edition = "2024"
description = "Run a Rust application from a single UKI."
repository = "https://github.com/yeetypete/uki-rs"
publish = false

[[bin]]
name = "init"
path = "src/main.rs"

[lints.clippy]
dbg_macro = "warn"
exit = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
todo = "warn"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[dependencies]
rustix = { version = "1", features = ["mount"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
