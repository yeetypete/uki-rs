[package]
name = "uki-rs"
version = "0.1.0"
edition = "2024"
description = "Run a Rust application from a single UKI."
license = "MIT"
repository = "https://github.com/yeetypete/uki-rs"
publish = false

[lints.clippy]
dbg_macro = "warn"
exit = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
todo = "warn"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
